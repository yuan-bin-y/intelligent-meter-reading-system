spring:
  application:
    name: meter-ai-simulator
  main:
    web-application-type: none
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:--}] %logger{40} - %msg%n%ex"

app:
  ai-simulator:
    backend-base-url: ${METER_BACKEND_BASE_URL:http://127.0.0.1:8070}
    service-id: ${AI_SERVICE_ID:meter-ai-service}
    secret-base64: ${AI_SERVICE_SECRET_BASE64}
    model-name: ${AI_SIMULATOR_MODEL_NAME:meter-reading-simulator}
    model-version: ${AI_SIMULATOR_MODEL_VERSION:1.0.0}
    mode: ${AI_SIMULATOR_MODE:SUCCESS}
    recognized-value: ${AI_SIMULATOR_RECOGNIZED_VALUE:123.456}
    confidence: ${AI_SIMULATOR_CONFIDENCE:0.9876}
    processing-delay: ${AI_SIMULATOR_PROCESSING_DELAY:PT1S}
    callback-timeout: ${AI_SIMULATOR_CALLBACK_TIMEOUT:PT10S}
    publisher-confirm-timeout: ${AI_SIMULATOR_PUBLISHER_CONFIRM_TIMEOUT:PT5S}
    max-consume-attempts: ${AI_SIMULATOR_MAX_CONSUME_ATTEMPTS:3}
    failure-code: ${AI_SIMULATOR_FAILURE_CODE:IMAGE_UNREADABLE}
    failure-message: ${AI_SIMULATOR_FAILURE_MESSAGE:模拟图片无法识别}
    # MODEL 模式：从 OSS 下载图片后调用视觉识别项目的 FastAPI 服务。
    model-base-url: ${AI_MODEL_BASE_URL:http://127.0.0.1:8001}
    model-request-timeout: ${AI_MODEL_REQUEST_TIMEOUT:PT90S}
    max-image-bytes: ${AI_MODEL_MAX_IMAGE_BYTES:15728640}
    oss-endpoint: ${OSS_ENDPOINT:}
    oss-access-key-id: ${OSS_ACCESS_KEY_ID:}
    oss-access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
