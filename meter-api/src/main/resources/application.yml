spring:
  application:
    name: intelligent-meter-reading-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: ${OSS_MAX_FILE_SIZE:10MB}
      max-request-size: ${OSS_MAX_REQUEST_SIZE:11MB}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.byy.meterreading: ${LOG_LEVEL_APP:INFO}
  file:
    path: ${LOG_PATH:logs}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:5GB}

# 只开放健康检查和 Prometheus 指标端点，其余 Actuator 端点不对外暴露。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # 对外只返回整体 UP/DOWN，避免泄露数据库、Redis 等连接信息。
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # 所有指标附加统一应用名，Prometheus 多服务查询时可以直接筛选。
      application: ${spring.application.name}

app:
  realtime:
    timeout: ${SSE_TIMEOUT:PT30M}
    heartbeat-interval-ms: ${SSE_HEARTBEAT_INTERVAL_MS:25000}
    replay-limit: ${SSE_REPLAY_LIMIT:100}
    redis-channel: ${SSE_REDIS_CHANNEL:meter:realtime:notifications}
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  storage:
    oss:
      enabled: ${OSS_ENABLED:false}
      endpoint: ${OSS_ENDPOINT:}
      bucket-name: ${OSS_BUCKET_NAME:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      access-url-ttl: ${OSS_ACCESS_URL_TTL:PT5M}
      max-file-size: ${OSS_MAX_FILE_SIZE:10MB}
      max-images-per-task: ${OSS_MAX_IMAGES_PER_TASK:5}
      cleanup-retention: ${OSS_CLEANUP_RETENTION:P7D}
      cleanup-interval: ${OSS_CLEANUP_INTERVAL:PT1H}
  device:
    heartbeat:
      ttl: ${DEVICE_HEARTBEAT_TTL:PT90S}
    offline-detection-interval: ${DEVICE_OFFLINE_DETECTION_INTERVAL:30000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:meter-reading-system}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
      secret-base64: ${JWT_SECRET_BASE64}
    ai-service:
      service-id: ${AI_SERVICE_ID:meter-ai-service}
      secret-base64: ${AI_SERVICE_SECRET_BASE64}
      allowed-clock-skew: ${AI_SERVICE_ALLOWED_CLOCK_SKEW:PT5M}
      nonce-ttl: ${AI_SERVICE_NONCE_TTL:PT10M}
      max-body-size: ${AI_SERVICE_MAX_BODY_SIZE:65536}
    auth-protection:
      login-per-minute: ${AUTH_LOGIN_PER_MINUTE:10}
      register-per-hour: ${AUTH_REGISTER_PER_HOUR:5}
      max-login-failures: ${AUTH_MAX_LOGIN_FAILURES:5}
      login-failure-window: ${AUTH_LOGIN_FAILURE_WINDOW:PT15M}
      login-lock-duration: ${AUTH_LOGIN_LOCK_DURATION:PT15M}

server:
  port: ${SERVER_PORT:8070}
