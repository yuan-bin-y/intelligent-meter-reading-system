name: meter-reading-stack

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: meter_reading
      MYSQL_USER: ${DB_USERNAME:-meter_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-meter_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
      - "127.0.0.1:${RABBITMQ_PROMETHEUS_PORT:-15693}:15692"
    volumes:
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  meter-api:
    build:
      context: ..
      dockerfile: deploy/docker/java.Dockerfile
      args:
        MODULE: meter-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-meter_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-meter_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in deploy/.env}
      AI_SERVICE_SECRET_BASE64: ${AI_SERVICE_SECRET_BASE64:?Set AI_SERVICE_SECRET_BASE64 in deploy/.env}
      OSS_ENABLED: "true"
      OSS_ENDPOINT: ${OSS_ENDPOINT:?Set OSS_ENDPOINT in deploy/.env}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:?Set OSS_BUCKET_NAME in deploy/.env}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?Set OSS_ACCESS_KEY_ID in deploy/.env}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?Set OSS_ACCESS_KEY_SECRET in deploy/.env}
      LOG_PATH: /logs
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${API_PORT:-8071}:8070"
    volumes:
      - api-logs:/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s

  meter-ai-service:
    build:
      context: ../meter-ai-service
    restart: unless-stopped
    environment:
      AI_RECOGNIZER: paddleocr
      AI_PADDLE_MODEL_PATH: models/meter_rec_yolo_v1
      AI_PADDLE_DEVICE: cpu
      AI_PADDLE_MODEL_SOURCE: BOS
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${AI_PORT:-8002}:8001"
    volumes:
      - paddle-cache:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  meter-ai-worker:
    build:
      context: ..
      dockerfile: deploy/docker/java.Dockerfile
      args:
        MODULE: meter-ai-simulator
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-meter_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env}
      METER_BACKEND_BASE_URL: http://meter-api:8070
      AI_SERVICE_SECRET_BASE64: ${AI_SERVICE_SECRET_BASE64:?Set AI_SERVICE_SECRET_BASE64 in deploy/.env}
      AI_SIMULATOR_MODE: MODEL
      AI_MODEL_BASE_URL: http://meter-ai-service:8001
      OSS_ENDPOINT: ${OSS_ENDPOINT:?Set OSS_ENDPOINT in deploy/.env}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?Set OSS_ACCESS_KEY_ID in deploy/.env}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?Set OSS_ACCESS_KEY_SECRET in deploy/.env}
      TZ: Asia/Shanghai
    depends_on:
      rabbitmq:
        condition: service_healthy
      meter-api:
        condition: service_healthy
      meter-ai-service:
        condition: service_healthy

  meter-web:
    build:
      context: ../meter-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      meter-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      meter-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  paddle-cache:
  api-logs:
  prometheus-data:
  grafana-data:

