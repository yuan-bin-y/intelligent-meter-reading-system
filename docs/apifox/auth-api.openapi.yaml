openapi: 3.0.3
info:
  title: 智能抄表系统后端接口
  description: 当前认证、用户、表具、设备、告警、任务、OSS 图片、抄表结果审核及正式抄表记录模块的 Apifox 测试文档。
  version: 2.9.0

servers:
  - url: http://localhost:8070
    description: 本地开发环境

tags:
  - name: 认证
    description: 用户注册、登录、身份查询和密码管理接口
  - name: 用户管理
    description: 仅拥有 ADMIN 角色的用户可以访问的后台用户管理接口
  - name: 表具管理
    description: 表具档案新增、分页、详情、修改、状态流转和逻辑删除接口，仅允许 ADMIN 访问
  - name: 居民表具绑定
    description: 管理员维护居民与表具关系，以及居民查询本人名下表具的接口
  - name: 设备管理
    description: 采集设备档案新增、分页、详情、修改、启停和逻辑删除接口，仅允许 ADMIN 访问
  - name: 设备接入
    description: 设备使用编号和密钥完成身份认证并上报心跳的接口
  - name: 设备表具绑定
    description: 管理员维护采集设备与表具的多对多绑定关系
  - name: 设备告警
    description: 管理员分页查询设备离线告警及其恢复情况
  - name: 抄表任务管理
    description: 管理员创建、查询、重新分配、取消和重试抄表任务
  - name: 抄表员任务
    description: 抄表员查询、开始并提交分配给本人的人工抄表任务
  - name: 设备抄表任务
    description: 认证设备拉取、接收并提交分配给本设备的自动抄表任务
  - name: 抄表图片
    description: 抄表员和设备上传图片、管理员治理图片以及登录用户获取短时访问地址
  - name: 抄表结果审核
    description: 管理员和审核员查询、通过或驳回抄表结果
  - name: 正式抄表记录
    description: 管理员和居民查询审核通过后生成的不可修改正式记录

paths:
  /api/v1/auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: 创建启用状态的新用户，并自动分配 RESIDENT 角色；注册成功后需调用登录接口获取 JWT。同一个客户端 IP 每小时最多请求注册接口 5 次，第 6 次返回 429。
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDTO'
            example:
              username: resident01
              password: '12345678'
              displayName: 张三
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 3
                  username: resident01
                  displayName: 张三
                  roles:
                    - RESIDENT
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
              example:
                code: BAD_REQUEST
                message: 请求参数不正确
                data:
                  password: 密码长度必须为8到128个字符
                traceId: 01JEXAMPLETRACEID
        '409':
          description: 用户名已经存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_CONFLICT
                message: 用户名已存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '429':
          description: 同一个客户端 IP 在一小时内请求注册接口超过 5 次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RATE_LIMITED
                message: 注册请求过于频繁，请稍后再试
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 使用用户名和密码完成认证，成功后返回 JWT Access Token 和 Refresh Token，并在 Redis 中创建登录会话。同一个客户端 IP 与用户名每分钟最多请求 10 次；同一用户名在 15 分钟内连续认证失败 5 次后锁定 15 分钟。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            example:
              username: admin
              password: 请填写生成BCrypt哈希时使用的明文密码
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResult'
              example:
                code: OK
                message: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.access.signature
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.signature
                  tokenType: Bearer
                  expiresIn: 7200
                  refreshExpiresIn: 604800
                  userId: 2
                  username: admin
                  displayName: 系统管理员
                  roles:
                    - ADMIN
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
              example:
                code: BAD_REQUEST
                message: 请求参数不正确
                data:
                  username: 用户名不能为空
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 用户名、密码或账号状态认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_FAILED
                message: 用户名或密码错误
                data: null
                traceId: 01JEXAMPLETRACEID
        '429':
          description: 登录接口请求过于频繁，或者用户名因连续认证失败而被临时锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                loginRateLimited:
                  summary: 同一个 IP 与用户名每分钟请求超过 10 次
                  value:
                    code: RATE_LIMITED
                    message: 登录请求过于频繁，请稍后再试
                    data: null
                    traceId: 01JEXAMPLETRACEID
                loginTemporarilyLocked:
                  summary: 同一用户名在 15 分钟内连续认证失败 5 次
                  value:
                    code: RATE_LIMITED
                    message: 登录失败次数过多，请15分钟后重试
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/refresh:
    post:
      tags:
        - 认证
      summary: 刷新 Token
      description: 使用有效的 Refresh Token 原子轮换 Redis 中的 refreshJti，并返回一组新的 Access Token 和 Refresh Token。旧 Refresh Token 立即失效。
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDTO'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.signature
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSuccessResult'
              example:
                code: OK
                message: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.new-access.signature
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.new-refresh.signature
                  tokenType: Bearer
                  expiresIn: 7200
                  refreshExpiresIn: 604800
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
              example:
                code: BAD_REQUEST
                message: 请求参数不正确
                data:
                  refreshToken: Refresh Token 不能为空
                traceId: 01JEXAMPLETRACEID
        '401':
          description: Refresh Token 无效、过期、已被使用或登录会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/logout:
    post:
      tags:
        - 认证
      summary: 退出当前登录会话
      description: 根据 Access Token 中的 userId 和 sid 删除当前设备的 Redis 会话，使该会话的 Access Token 和 Refresh Token 同时失效。
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResult'
              example:
                code: OK
                message: success
                data: null
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未携带 Access Token、Token 无效、Token 已过期或登录会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/me:
    get:
      tags:
        - 认证
      summary: 获取当前登录用户
      description: 校验请求中的 JWT，并根据 Token 内的用户 ID 查询数据库中的最新用户信息和角色。
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 2
                  username: admin
                  displayName: 系统管理员
                  roles:
                    - ADMIN
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未携带 Token、Token 无效、Token 已过期或账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '403':
          description: 当前登录用户无权访问资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: FORBIDDEN
                message: 无权限访问
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/password:
    put:
      tags:
        - 认证
      summary: 修改当前用户密码
      description: 根据 Bearer JWT 确定当前用户，验证原密码后保存新密码的 BCrypt 哈希，并清除该用户全部 Redis 登录会话。
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDTO'
            example:
              oldPassword: '12345678'
              newPassword: newPassword123
      responses:
        '200':
          description: 密码修改成功，当前用户所有设备均需重新登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResult'
              example:
                code: OK
                message: success
                data: null
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 参数校验失败、原密码错误或新旧密码相同
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResult'
                  - $ref: '#/components/schemas/ErrorResult'
              examples:
                validationFailed:
                  summary: 新密码长度不正确
                  value:
                    code: BAD_REQUEST
                    message: 请求参数不正确
                    data:
                      newPassword: 密码长度必须为8到128个字符
                    traceId: 01JEXAMPLETRACEID
                oldPasswordIncorrect:
                  summary: 原密码错误
                  value:
                    code: BAD_REQUEST
                    message: 原密码错误
                    data: null
                    traceId: 01JEXAMPLETRACEID
                samePassword:
                  summary: 新密码与原密码相同
                  value:
                    code: BAD_REQUEST
                    message: 新密码不能与原密码相同
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '401':
          description: 未携带 Token、Token 无效、Token 已过期或账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/admin/users:
    post:
      tags:
        - 用户管理
      summary: 管理员创建用户
      description: 创建用户、使用 BCrypt 保存密码哈希，并在同一数据库事务中批量绑定初始角色。仅 ADMIN 可访问。
      operationId: createAdminUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserDTO'
            example:
              username: reader01
              password: '12345678'
              displayName: 抄表员张三
              status: 1
              roles:
                - METER_READER
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 4
                  username: reader01
                  displayName: 抄表员张三
                  status: 1
                  roles:
                    - METER_READER
                  createdAt: '2026-09-16T12:00:00'
                  updatedAt: '2026-09-16T12:00:00'
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 用户名、密码、显示名称、状态或角色参数校验失败，或者包含不存在、已禁用的角色
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResult'
                  - $ref: '#/components/schemas/ErrorResult'
              examples:
                validationFailed:
                  summary: 请求字段校验失败
                  value:
                    code: BAD_REQUEST
                    message: 请求参数不正确
                    data:
                      password: 密码长度必须为8到128个字符
                    traceId: 01JEXAMPLETRACEID
                invalidRole:
                  summary: 角色不存在或已禁用
                  value:
                    code: BAD_REQUEST
                    message: 角色不存在或已禁用：UNKNOWN_ROLE
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
          description: 用户名已经存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_CONFLICT
                message: 用户名已存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误，数据库事务会回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

    get:
      tags:
        - 用户管理
      summary: 分页查询用户
      description: 按用户名、状态和角色筛选用户。仅 ADMIN 可访问；用户基本信息分页查询后，会批量查询当前页用户的有效角色。
      operationId: listAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始，默认 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每页数量，默认 20，最大 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: username
          in: query
          required: false
          description: 用户名关键字，支持模糊查询
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          description: 用户状态，0 禁用，1 启用
          schema:
            type: integer
            enum:
              - 0
              - 1
        - name: roleCode
          in: query
          required: false
          description: 角色编码，服务端会去除首尾空格并转换为大写
          schema:
            type: string
            maxLength: 64
          example: ADMIN
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageSuccessResult'
              example:
                code: OK
                message: success
                data:
                  records:
                    - userId: 2
                      username: admin
                      displayName: 系统管理员
                      status: 1
                      roles:
                        - ADMIN
                      createdAt: '2026-09-16T10:00:00'
                      updatedAt: '2026-09-16T10:00:00'
                  total: 1
                  page: 1
                  pageSize: 20
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 页码、每页数量、状态或筛选字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
        '401':
          description: 未携带 Access Token、Token 无效、已过期或 Redis 会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: FORBIDDEN
                message: 无权限访问
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/users/{userId}:
    get:
      tags:
        - 用户管理
      summary: 查询用户详情
      description: 根据用户 ID 查询用户基本信息和当前拥有的有效角色，仅 ADMIN 可访问。
      operationId: getAdminUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 3
                  username: resident01
                  displayName: 张三
                  status: 1
                  roles:
                    - RESIDENT
                  createdAt: '2026-09-16T10:00:00'
                  updatedAt: '2026-09-16T10:00:00'
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_NOT_FOUND
                message: 用户不存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/users/{userId}/status:
    put:
      tags:
        - 用户管理
      summary: 启用或禁用用户
      description: 修改用户状态和更新时间。状态变化后清除该用户全部 Redis 登录会话；当前管理员不能禁用自己的账号。
      operationId: updateAdminUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusDTO'
            example:
              status: 0
      responses:
        '200':
