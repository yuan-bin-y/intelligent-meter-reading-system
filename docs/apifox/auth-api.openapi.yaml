        - 设备告警
      summary: 分页查询设备告警
      description: 使用 device_alarm 和 device 两表关联查询。支持按设备编号、设备名称、告警类型、告警状态和发生时间范围筛选，仅允许 ADMIN 访问。
      operationId: listDeviceAlarms
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始，默认 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 每页数量，默认 20，最大 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: deviceNo
          in: query
          description: 按设备编号模糊匹配
          schema:
            type: string
            maxLength: 64
          example: CAMERA-2026
        - name: deviceName
          in: query
          description: 按设备名称模糊匹配
          schema:
            type: string
            maxLength: 64
          example: 1号采集摄像头
        - name: alarmType
          in: query
          description: 告警类型，当前仅支持设备离线
          schema:
            $ref: '#/components/schemas/DeviceAlarmType'
        - name: alarmStatus
          in: query
          description: 告警状态
          schema:
            $ref: '#/components/schemas/DeviceAlarmStatus'
        - name: occurredAtStart
          in: query
          description: 告警发生时间范围的开始时间，使用 ISO-8601 格式
          schema:
            type: string
            format: date-time
          example: '2026-09-19T00:00:00'
        - name: occurredAtEnd
          in: query
          description: 告警发生时间范围的结束时间，不能早于开始时间
          schema:
            type: string
            format: date-time
          example: '2026-09-19T23:59:59'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAlarmPageSuccessResult'
              example:
                code: OK
                message: success
                data:
                  records:
                    - id: 12
                      deviceId: 5
                      deviceNo: CAMERA-2026-001
                      deviceName: 1号采集摄像头
                      alarmType: OFFLINE
                      alarmTypeName: 设备离线
                      alarmStatus: OPEN
                      alarmStatusName: 未恢复
                      occurredAt: '2026-09-19T10:34:56'
                      recoveredAt: null
                  total: 1
                  page: 1
                  pageSize: 20
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 分页参数、枚举值或时间范围错误
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResult'
                  - $ref: '#/components/schemas/ErrorResult'
        '401':
          description: 未登录或登录会话已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

