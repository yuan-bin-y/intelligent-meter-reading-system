      description: 已启用设备通过 X-Device-No 和 X-Device-Secret 请求头完成认证。认证成功后在 Redis 中写入或刷新心跳，默认 TTL 为 90 秒；超过 TTL 未再次上报时，设备自动判定为离线。请求不需要 Body。
      operationId: heartbeat
      security:
        - deviceNoHeader: []
          deviceSecretHeader: []
      responses:
        '200':
          description: 心跳接收成功，Redis 在线状态和 TTL 已刷新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResult'
              example:
                code: OK
                message: success
                data: null
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 缺少设备认证请求头、设备不存在或设备密钥错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 设备已经停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
