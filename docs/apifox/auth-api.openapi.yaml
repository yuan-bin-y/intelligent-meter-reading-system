openapi: 3.0.3
info:
  title: 智能抄表系统认证接口
  description: 当前认证模块的 Apifox 测试文档，包含登录和获取当前登录用户接口。
  version: 1.1.0

servers:
  - url: http://localhost:8070
    description: 本地开发环境

tags:
  - name: 认证
    description: 用户登录及登录身份查询接口

paths:
  /api/v1/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 使用用户名和密码完成认证，成功后返回 JWT Access Token。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            example:
              username: admin
              password: 请填写生成BCrypt哈希时使用的明文密码
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResult'
              example:
                code: OK
                message: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.example.signature
                  tokenType: Bearer
                  expiresIn: 7200
                  userId: 2
                  username: admin
                  displayName: 系统管理员
                  roles:
                    - ADMIN
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
              example:
                code: BAD_REQUEST
                message: 请求参数不正确
                data:
                  username: 用户名不能为空
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 用户名、密码或账号状态认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_FAILED
                message: 用户名或密码错误
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/me:
    get:
      tags:
        - 认证
      summary: 获取当前登录用户
      description: 校验请求中的 JWT，并根据 Token 内的用户 ID 查询数据库中的最新用户信息和角色。
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 2
                  username: admin
                  displayName: 系统管理员
                  roles:
                    - ADMIN
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未携带 Token、Token 无效、Token 已过期或账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '403':
          description: 当前登录用户无权访问资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: FORBIDDEN
                message: 无权限访问
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 64
          description: 登录用户名
          example: admin
        password:
          type: string
          format: password
          maxLength: 128
          description: 登录明文密码，仅通过 HTTPS 传输

    LoginVO:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - userId
        - username
        - displayName
        - roles
      properties:
        accessToken:
          type: string
          description: JWT Access Token
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          format: int64
          description: Token 剩余有效时间，单位为秒
          example: 7200
        userId:
          type: integer
          format: int64
          example: 2
        username:
          type: string
          example: admin
        displayName:
          type: string
          example: 系统管理员
        roles:
          type: array
          items:
            type: string
          example:
            - ADMIN

    LoginSuccessResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          enum:
            - OK
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/LoginVO'
        traceId:
          type: string
          description: 本次请求的追踪标识

    CurrentUserVO:
      type: object
      required:
        - userId
        - username
        - displayName
        - roles
      properties:
        userId:
          type: integer
          format: int64
          description: 当前登录用户 ID
          example: 2
        username:
          type: string
          description: 登录用户名
          example: admin
        displayName:
          type: string
          description: 用户显示名称
          example: 系统管理员
        roles:
          type: array
          description: 当前用户拥有的角色编码
          items:
            type: string
          example:
            - ADMIN

    CurrentUserSuccessResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          enum:
            - OK
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/CurrentUserVO'
        traceId:
          type: string
          description: 本次请求的追踪标识

    ValidationErrorResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
        message:
          type: string
          example: 请求参数不正确
        data:
          type: object
          additionalProperties:
            type: string
        traceId:
          type: string

    ErrorResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          example: AUTH_FAILED
        message:
          type: string
          example: 用户名或密码错误
        data:
          type: object
          nullable: true
          description: 错误响应时为 null
        traceId:
          type: string
