openapi: 3.0.3
info:
  title: 智能抄表系统后端接口
  description: 当前认证、用户管理和表具管理模块的 Apifox 测试文档，包含认证、Redis 会话、管理员用户管理以及表具档案创建接口。
  version: 1.8.0

servers:
  - url: http://localhost:8070
    description: 本地开发环境

tags:
  - name: 认证
    description: 用户注册、登录、身份查询和密码管理接口
  - name: 用户管理
    description: 仅拥有 ADMIN 角色的用户可以访问的后台用户管理接口
  - name: 表具管理
    description: 表具档案管理接口；当前新增表具接口仅允许 ADMIN 访问

paths:
  /api/v1/auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: 创建启用状态的新用户，并自动分配 RESIDENT 角色；注册成功后需调用登录接口获取 JWT。同一个客户端 IP 每小时最多请求注册接口 5 次，第 6 次返回 429。
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDTO'
            example:
              username: resident01
              password: '12345678'
              displayName: 张三
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 3
                  username: resident01
                  displayName: 张三
                  roles:
                    - RESIDENT
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
              example:
                code: BAD_REQUEST
                message: 请求参数不正确
                data:
                  password: 密码长度必须为8到128个字符
                traceId: 01JEXAMPLETRACEID
        '409':
          description: 用户名已经存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_CONFLICT
                message: 用户名已存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '429':
          description: 同一个客户端 IP 在一小时内请求注册接口超过 5 次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RATE_LIMITED
                message: 注册请求过于频繁，请稍后再试
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 使用用户名和密码完成认证，成功后返回 JWT Access Token 和 Refresh Token，并在 Redis 中创建登录会话。同一个客户端 IP 与用户名每分钟最多请求 10 次；同一用户名在 15 分钟内连续认证失败 5 次后锁定 15 分钟。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            example:
              username: admin
              password: 请填写生成BCrypt哈希时使用的明文密码
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResult'
              example:
                code: OK
                message: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.access.signature
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.signature
                  tokenType: Bearer
                  expiresIn: 7200
                  refreshExpiresIn: 604800
                  userId: 2
                  username: admin
                  displayName: 系统管理员
                  roles:
                    - ADMIN
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
              example:
                code: BAD_REQUEST
                message: 请求参数不正确
                data:
                  username: 用户名不能为空
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 用户名、密码或账号状态认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_FAILED
                message: 用户名或密码错误
                data: null
                traceId: 01JEXAMPLETRACEID
        '429':
          description: 登录接口请求过于频繁，或者用户名因连续认证失败而被临时锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                loginRateLimited:
                  summary: 同一个 IP 与用户名每分钟请求超过 10 次
                  value:
                    code: RATE_LIMITED
                    message: 登录请求过于频繁，请稍后再试
                    data: null
                    traceId: 01JEXAMPLETRACEID
                loginTemporarilyLocked:
                  summary: 同一用户名在 15 分钟内连续认证失败 5 次
                  value:
                    code: RATE_LIMITED
                    message: 登录失败次数过多，请15分钟后重试
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/refresh:
    post:
      tags:
        - 认证
      summary: 刷新 Token
      description: 使用有效的 Refresh Token 原子轮换 Redis 中的 refreshJti，并返回一组新的 Access Token 和 Refresh Token。旧 Refresh Token 立即失效。
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDTO'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.signature
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSuccessResult'
              example:
                code: OK
                message: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.new-access.signature
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.new-refresh.signature
                  tokenType: Bearer
                  expiresIn: 7200
                  refreshExpiresIn: 604800
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
              example:
                code: BAD_REQUEST
                message: 请求参数不正确
                data:
                  refreshToken: Refresh Token 不能为空
                traceId: 01JEXAMPLETRACEID
        '401':
          description: Refresh Token 无效、过期、已被使用或登录会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/logout:
    post:
      tags:
        - 认证
      summary: 退出当前登录会话
      description: 根据 Access Token 中的 userId 和 sid 删除当前设备的 Redis 会话，使该会话的 Access Token 和 Refresh Token 同时失效。
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResult'
              example:
                code: OK
                message: success
                data: null
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未携带 Access Token、Token 无效、Token 已过期或登录会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/me:
    get:
      tags:
        - 认证
      summary: 获取当前登录用户
      description: 校验请求中的 JWT，并根据 Token 内的用户 ID 查询数据库中的最新用户信息和角色。
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 2
                  username: admin
                  displayName: 系统管理员
                  roles:
                    - ADMIN
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未携带 Token、Token 无效、Token 已过期或账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '403':
          description: 当前登录用户无权访问资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: FORBIDDEN
                message: 无权限访问
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/auth/password:
    put:
      tags:
        - 认证
      summary: 修改当前用户密码
      description: 根据 Bearer JWT 确定当前用户，验证原密码后保存新密码的 BCrypt 哈希，并清除该用户全部 Redis 登录会话。
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDTO'
            example:
              oldPassword: '12345678'
              newPassword: newPassword123
      responses:
        '200':
          description: 密码修改成功，当前用户所有设备均需重新登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResult'
              example:
                code: OK
                message: success
                data: null
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 参数校验失败、原密码错误或新旧密码相同
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResult'
                  - $ref: '#/components/schemas/ErrorResult'
              examples:
                validationFailed:
                  summary: 新密码长度不正确
                  value:
                    code: BAD_REQUEST
                    message: 请求参数不正确
                    data:
                      newPassword: 密码长度必须为8到128个字符
                    traceId: 01JEXAMPLETRACEID
                oldPasswordIncorrect:
                  summary: 原密码错误
                  value:
                    code: BAD_REQUEST
                    message: 原密码错误
                    data: null
                    traceId: 01JEXAMPLETRACEID
                samePassword:
                  summary: 新密码与原密码相同
                  value:
                    code: BAD_REQUEST
                    message: 新密码不能与原密码相同
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '401':
          description: 未携带 Token、Token 无效、Token 已过期或账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: INTERNAL_ERROR
                message: 服务器内部错误
                data: null
                traceId: 01JEXAMPLETRACEID

  /api/v1/admin/users:
    post:
      tags:
        - 用户管理
      summary: 管理员创建用户
      description: 创建用户、使用 BCrypt 保存密码哈希，并在同一数据库事务中批量绑定初始角色。仅 ADMIN 可访问。
      operationId: createAdminUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserDTO'
            example:
              username: reader01
              password: '12345678'
              displayName: 抄表员张三
              status: 1
              roles:
                - METER_READER
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 4
                  username: reader01
                  displayName: 抄表员张三
                  status: 1
                  roles:
                    - METER_READER
                  createdAt: '2026-09-16T12:00:00'
                  updatedAt: '2026-09-16T12:00:00'
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 用户名、密码、显示名称、状态或角色参数校验失败，或者包含不存在、已禁用的角色
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResult'
                  - $ref: '#/components/schemas/ErrorResult'
              examples:
                validationFailed:
                  summary: 请求字段校验失败
                  value:
                    code: BAD_REQUEST
                    message: 请求参数不正确
                    data:
                      password: 密码长度必须为8到128个字符
                    traceId: 01JEXAMPLETRACEID
                invalidRole:
                  summary: 角色不存在或已禁用
                  value:
                    code: BAD_REQUEST
                    message: 角色不存在或已禁用：UNKNOWN_ROLE
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
          description: 用户名已经存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_CONFLICT
                message: 用户名已存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误，数据库事务会回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

    get:
      tags:
        - 用户管理
      summary: 分页查询用户
      description: 按用户名、状态和角色筛选用户。仅 ADMIN 可访问；用户基本信息分页查询后，会批量查询当前页用户的有效角色。
      operationId: listAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始，默认 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每页数量，默认 20，最大 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: username
          in: query
          required: false
          description: 用户名关键字，支持模糊查询
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          description: 用户状态，0 禁用，1 启用
          schema:
            type: integer
            enum:
              - 0
              - 1
        - name: roleCode
          in: query
          required: false
          description: 角色编码，服务端会去除首尾空格并转换为大写
          schema:
            type: string
            maxLength: 64
          example: ADMIN
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageSuccessResult'
              example:
                code: OK
                message: success
                data:
                  records:
                    - userId: 2
                      username: admin
                      displayName: 系统管理员
                      status: 1
                      roles:
                        - ADMIN
                      createdAt: '2026-09-16T10:00:00'
                      updatedAt: '2026-09-16T10:00:00'
                  total: 1
                  page: 1
                  pageSize: 20
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 页码、每页数量、状态或筛选字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
        '401':
          description: 未携带 Access Token、Token 无效、已过期或 Redis 会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: FORBIDDEN
                message: 无权限访问
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/users/{userId}:
    get:
      tags:
        - 用户管理
      summary: 查询用户详情
      description: 根据用户 ID 查询用户基本信息和当前拥有的有效角色，仅 ADMIN 可访问。
      operationId: getAdminUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 3
                  username: resident01
                  displayName: 张三
                  status: 1
                  roles:
                    - RESIDENT
                  createdAt: '2026-09-16T10:00:00'
                  updatedAt: '2026-09-16T10:00:00'
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_NOT_FOUND
                message: 用户不存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/users/{userId}/status:
    put:
      tags:
        - 用户管理
      summary: 启用或禁用用户
      description: 修改用户状态和更新时间。状态变化后清除该用户全部 Redis 登录会话；当前管理员不能禁用自己的账号。
      operationId: updateAdminUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusDTO'
            example:
              status: 0
      responses:
        '200':
          description: 状态修改成功；如果目标状态与当前状态相同，则直接返回现有用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 3
                  username: resident01
                  displayName: 张三
                  status: 0
                  roles:
                    - RESIDENT
                  createdAt: '2026-09-16T10:00:00'
                  updatedAt: '2026-09-16T11:00:00'
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 状态参数校验失败，或者当前管理员尝试禁用自己
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResult'
                  - $ref: '#/components/schemas/ErrorResult'
              examples:
                invalidStatus:
                  summary: 状态不是 0 或 1
                  value:
                    code: BAD_REQUEST
                    message: 请求参数不正确
                    data:
                      status: 用户状态只能是0或1
                    traceId: 01JEXAMPLETRACEID
                disableSelf:
                  summary: 当前管理员禁用自己
                  value:
                    code: BAD_REQUEST
                    message: 不能禁用当前登录账号
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404':
          description: 目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_NOT_FOUND
                message: 用户不存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误，包括 Redis 会话清理失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/users/{userId}/roles:
    put:
      tags:
        - 用户管理
      summary: 修改用户角色
      description: 校验角色编码后，在同一数据库事务中删除旧角色关系并批量写入新关系。角色变化后清除该用户全部 Redis 登录会话；当前管理员不能移除自己的 ADMIN 角色。
      operationId: updateAdminUserRoles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesDTO'
            example:
              roles:
                - METER_READER
                - AUDITOR
      responses:
        '200':
          description: 角色修改成功；如果新旧角色相同，则直接返回现有用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 3
                  username: resident01
                  displayName: 张三
                  status: 1
                  roles:
                    - METER_READER
                    - AUDITOR
                  createdAt: '2026-09-16T10:00:00'
                  updatedAt: '2026-09-16T10:00:00'
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 角色集合校验失败、角色不存在或已禁用，或者当前管理员尝试移除自己的 ADMIN 角色
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResult'
                  - $ref: '#/components/schemas/ErrorResult'
              examples:
                invalidRole:
                  summary: 角色不存在或已禁用
                  value:
                    code: BAD_REQUEST
                    message: 角色不存在或已禁用：UNKNOWN_ROLE
                    data: null
                    traceId: 01JEXAMPLETRACEID
                removeOwnAdmin:
                  summary: 当前管理员移除自己的 ADMIN 角色
                  value:
                    code: BAD_REQUEST
                    message: 不能移除当前登录账号的 ADMIN 角色
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404':
          description: 目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_NOT_FOUND
                message: 用户不存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误，包括数据库批量更新或 Redis 会话清理失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/users/{userId}/profile:
    put:
      tags:
        - 用户管理
      summary: 修改用户基本资料
      description: 修改指定用户的显示名称和更新时间。当前版本不允许修改登录用户名，仅 ADMIN 可访问。
      operationId: updateAdminUserProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileDTO'
            example:
              displayName: 抄表员李四
      responses:
        '200':
          description: 修改成功；显示名称没有变化时直接返回当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuccessResult'
              example:
                code: OK
                message: success
                data:
                  userId: 4
                  username: reader01
                  displayName: 抄表员李四
                  status: 1
                  roles:
                    - METER_READER
                  createdAt: '2026-09-16T12:00:00'
                  updatedAt: '2026-09-16T13:00:00'
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 显示名称为空或超过 64 个字符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404':
          description: 目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_NOT_FOUND
                message: 用户不存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/users/{userId}/password:
    put:
      tags:
        - 用户管理
      summary: 管理员重置用户密码
      description: 使用 BCrypt 保存新密码，成功后撤销该用户全部 Access Token 和 Refresh Token 会话。支持重置启用或禁用用户的密码。
      operationId: resetAdminUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordDTO'
            example:
              newPassword: newPassword123
      responses:
        '200':
          description: 密码重置成功，该用户全部设备均需重新登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResult'
              example:
                code: OK
                message: success
                data: null
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 新密码为空或长度不是 8 到 128 个字符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResult'
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404':
          description: 目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: 服务器内部错误，包括 Redis 会话清理失败；发生异常时数据库密码更新会回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/users/{userId}/login-lock:
    delete:
      tags:
        - 用户管理
      summary: 解除用户登录锁定
      description: 删除 Redis 中该用户名对应的登录失败次数和临时锁定状态。Redis 删除失败时返回 500，不返回虚假的成功结果。
      operationId: clearAdminUserLoginLock
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: 解锁成功；用户当前未锁定时也返回成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResult'
              example:
                code: OK
                message: success
                data: null
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404':
          description: 目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: Redis 不可用或服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/roles:
    get:
      tags:
        - 用户管理
      summary: 查询可分配角色
      description: 查询 sys_role 中全部启用角色，供创建用户和修改角色时选择，仅 ADMIN 可访问。
      operationId: listAssignableRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignableRoleListSuccessResult'
              example:
                code: OK
                message: success
                data:
                  - roleId: 1
                    roleCode: ADMIN
                    roleName: 管理员
                  - roleId: 2
                    roleCode: METER_READER
                    roleName: 抄表员
                  - roleId: 3
                    roleCode: AUDITOR
                    roleName: 审核员
                  - roleId: 4
                    roleCode: RESIDENT
                    roleName: 居民
                traceId: 01JEXAMPLETRACEID
        '401':
          description: 未登录或登录会话已经失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/v1/admin/meters:
    post:
      tags:
        - 表具管理
      summary: 新增表具
      description: 新增一条表具档案。表具编号全局唯一；状态固定初始化为正常，乐观锁版本初始化为 0，创建人和修改人从已验证的 Access Token 中取得。仅 ADMIN 可访问。
      operationId: createMeter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeterDTO'
            example:
              meterNo: WATER-2026-001
              meterName: 1号水表
              meterType: WATER
              displayType: MECHANICAL_ROLLER
              unit: m³
              integerDigits: 6
              decimalDigits: 2
              initialReading: 12.35
              installedAt: '2026-09-17'
              remark: 测试表具
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMeterSuccessResult'
              example:
                code: OK
                message: success
                data:
                  meterId: 1
                  meterNo: WATER-2026-001
                traceId: 01JEXAMPLETRACEID
        '400':
          description: 字段校验失败，或者计量单位、初始读数不符合表具业务规则
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResult'
                  - $ref: '#/components/schemas/ErrorResult'
              examples:
                validationFailed:
                  summary: 字段校验失败
                  value:
                    code: BAD_REQUEST
                    message: 请求参数不正确
                    data:
                      integerDigits: 整数位数不能大于12
                    traceId: 01JEXAMPLETRACEID
                invalidUnit:
                  summary: 表具类型和计量单位不匹配
                  value:
                    code: BAD_REQUEST
                    message: 水表的计量单位必须是m³
                    data: null
                    traceId: 01JEXAMPLETRACEID
        '401':
          description: 未携带 Access Token、Token 无效、已过期或 Redis 会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: AUTH_REQUIRED
                message: 请先登录
                data: null
                traceId: 01JEXAMPLETRACEID
        '403':
          description: 当前用户没有 ADMIN 角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: FORBIDDEN
                message: 无权限访问
                data: null
                traceId: 01JEXAMPLETRACEID
        '409':
          description: 表具编号已经存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: RESOURCE_CONFLICT
                message: 表具编号已存在
                data: null
                traceId: 01JEXAMPLETRACEID
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      description: 目标用户 ID
      schema:
        type: integer
        format: int64
      example: 3

  schemas:
    CreateMeterDTO:
      type: object
      required:
        - meterNo
        - meterName
        - meterType
        - displayType
        - unit
        - integerDigits
        - decimalDigits
        - initialReading
      properties:
        meterNo:
          type: string
          minLength: 1
          maxLength: 64
          description: 全局唯一的表具编号；服务端会去除首尾空格，创建后不通过普通资料接口修改
          example: WATER-2026-001
        meterName:
          type: string
          minLength: 1
          maxLength: 64
          description: 表具名称；服务端会去除首尾空格
          example: 1号水表
        meterType:
          type: string
          enum:
            - WATER
            - ELECTRIC
            - GAS
          description: 表具测量类型
          example: WATER
        displayType:
          type: string
          enum:
            - LCD
            - MECHANICAL_ROLLER
          description: 读数显示类型，分别表示液晶显示型和机械滚轮型
          example: MECHANICAL_ROLLER
        unit:
          type: string
          minLength: 1
          maxLength: 16
          description: 标准计量单位；WATER 和 GAS 必须为 m³，ELECTRIC 必须为 kWh
          example: m³
        integerDigits:
          type: integer
          minimum: 1
          maximum: 12
          description: 表盘读数的整数位数
          example: 6
        decimalDigits:
          type: integer
          minimum: 0
          maximum: 3
          description: 表盘读数的小数位数
          example: 2
        initialReading:
          type: number
          minimum: 0
          multipleOf: 0.001
          description: 安装初始读数；最多 15 位整数和 3 位小数，并且必须符合当前表盘位数
          example: 12.35
        installedAt:
          type: string
          format: date
          nullable: true
          description: 安装日期，可不传；传入时不能晚于今天
          example: '2026-09-17'
        remark:
          type: string
          maxLength: 500
          nullable: true
          description: 备注；服务端会去除首尾空格，纯空白按 null 保存
          example: 测试表具

    CreateMeterVO:
      type: object
      required:
        - meterId
        - meterNo
      properties:
        meterId:
          type: integer
          format: int64
          description: MySQL 生成的表具主键
          example: 1
        meterNo:
          type: string
          description: 创建成功的表具编号
          example: WATER-2026-001

    CreateMeterSuccessResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          enum:
            - OK
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/CreateMeterVO'
        traceId:
          type: string
          description: 本次请求的追踪标识

    AdminCreateUserDTO:
      type: object
      required:
        - username
        - password
        - displayName
        - status
        - roles
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 登录用户名，服务端会去除首尾空格，不能与已有用户重复
          example: reader01
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 初始明文密码，仅通过 HTTPS 传输，服务端只保存 BCrypt 哈希
          example: '12345678'
        displayName:
          type: string
          minLength: 1
          maxLength: 64
          description: 用户显示名称，服务端会去除首尾空格
          example: 抄表员张三
        status:
          type: integer
          enum:
            - 0
            - 1
          description: 初始状态，0 禁用，1 启用
          example: 1
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: 初始角色编码；服务端会去除首尾空格、转成大写并去重
          items:
            type: string
            minLength: 1
            maxLength: 64
          example:
            - METER_READER

    UpdateUserProfileDTO:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
          description: 新的用户显示名称
          example: 抄表员李四

    AdminResetPasswordDTO:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 管理员为目标用户设置的新明文密码
          example: newPassword123

    AssignableRoleVO:
      type: object
      required:
        - roleId
        - roleCode
        - roleName
      properties:
        roleId:
          type: integer
          format: int64
          description: 角色 ID
          example: 2
        roleCode:
          type: string
          description: 角色编码
          example: METER_READER
        roleName:
          type: string
          description: 角色名称
          example: 抄表员

    AssignableRoleListSuccessResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          enum:
            - OK
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/AssignableRoleVO'
        traceId:
          type: string
          description: 本次请求的追踪标识

    UpdateUserStatusDTO:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          minimum: 0
          maximum: 1
          enum:
            - 0
            - 1
          description: 用户状态，0 禁用，1 启用
          example: 0

    UpdateUserRolesDTO:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: 新的角色编码集合；服务端会去除首尾空格、转换为大写并自动去重
          items:
            type: string
            minLength: 1
            maxLength: 64
          example:
            - METER_READER
            - AUDITOR

    AdminUserVO:
      type: object
      required:
        - userId
        - username
        - displayName
        - status
        - roles
        - createdAt
        - updatedAt
      properties:
        userId:
          type: integer
          format: int64
          description: 用户 ID
          example: 3
        username:
          type: string
          description: 登录用户名
          example: resident01
        displayName:
          type: string
          description: 用户显示名称
          example: 张三
        status:
          type: integer
          enum:
            - 0
            - 1
          description: 用户状态，0 禁用，1 启用
          example: 1
        roles:
          type: array
          description: 用户当前拥有的有效角色编码
          items:
            type: string
          example:
            - RESIDENT
        createdAt:
          type: string
          format: date-time
          description: 用户创建时间
          example: '2026-09-16T10:00:00'
        updatedAt:
          type: string
          format: date-time
          description: 用户最后更新时间
          example: '2026-09-16T10:00:00'

    AdminUserPageVO:
      type: object
      required:
        - records
        - total
        - page
        - pageSize
      properties:
        records:
          type: array
          description: 当前页用户
          items:
            $ref: '#/components/schemas/AdminUserVO'
        total:
          type: integer
          format: int64
          description: 符合条件的用户总数
          example: 1
        page:
          type: integer
          format: int64
          description: 当前页码
          example: 1
        pageSize:
          type: integer
          format: int64
          description: 每页数量
          example: 20

    AdminUserSuccessResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          enum:
            - OK
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AdminUserVO'
        traceId:
          type: string
          description: 本次请求的追踪标识

    AdminUserPageSuccessResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          enum:
            - OK
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AdminUserPageVO'
        traceId:
          type: string
          description: 本次请求的追踪标识

    ChangePasswordDTO:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          format: password
          maxLength: 128
          description: 当前使用的明文密码
          example: '12345678'
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 准备设置的新明文密码，不能与原密码相同
          example: newPassword123

    EmptySuccessResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          enum:
            - OK
        message:
          type: string
          example: success
        data:
          type: object
          nullable: true
          description: 当前操作没有业务响应数据，固定为 null
        traceId:
          type: string
