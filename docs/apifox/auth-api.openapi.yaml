        - 表具管理
      summary: 修改表具状态
      description: 按生命周期状态机修改状态并校验 version。正常可转停用、维护中或已报废；停用可转正常或已报废；维护中可转正常或已报废；已报废不可再修改。仅 ADMIN 可访问。
      operationId: updateMeterStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
