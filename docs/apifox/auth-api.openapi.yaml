              status: 2
              version: 0
      responses:
        '200':
          description: 状态修改成功，返回递增后的版本号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterVersionSuccessResult'
        '400':
          description: 状态或版本参数校验失败，或者状态流转不允许
